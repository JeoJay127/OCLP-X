name: Sync and Update

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      build:
        description: Build even when upstream has no new commits
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-and-update
  cancel-in-progress: false
  queue: max

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/dortania/OpenCore-Legacy-Patcher.git
          git fetch origin main
          git fetch --no-tags upstream main
          git checkout -B main origin/main

      - name: Merge upstream changes
        id: sync
        run: |
          source .github/upstream-preserve.sh
          oclp_upstream_pathspec
          has_new_commits=false
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            has_new_commits=true
          fi
          has_tree_changes=false
          if ! git diff --quiet HEAD upstream/main -- "${OCLP_UPSTREAM_PATHSPEC[@]}"; then
            has_tree_changes=true
          fi
          if [[ "$has_new_commits" == false && "$has_tree_changes" == false ]]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          if [[ "$has_new_commits" == true ]]; then
            git merge --no-commit --no-ff -s ours upstream/main
          fi
          git restore --source=upstream/main --staged --worktree --no-overlay -- "${OCLP_UPSTREAM_PATHSPEC[@]}"
          git commit -m "Merge upstream changes while preserving local modifications"
          git push origin HEAD:main
          echo "has_updates=true" >> "$GITHUB_OUTPUT"

      - name: Trigger build
        if: steps.sync.outputs.has_updates == 'true' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.build)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-app-wxpython.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Publish upstream release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source .github/upstream-preserve.sh
          upstream_tag=$(gh api 'repos/dortania/OpenCore-Legacy-Patcher/releases?per_page=20' --jq 'map(select(.draft == false)) | .[0].tag_name // empty')
          if [[ -z "$upstream_tag" ]]; then
            exit 0
          fi
          git check-ref-format "refs/tags/$upstream_tag"
          if ! git ls-remote --quiet --exit-code --refs --tags origin "refs/tags/$upstream_tag" >/dev/null; then
            fork_main_commit=$(git rev-parse HEAD)
            git fetch --no-tags upstream "refs/tags/$upstream_tag"
            git switch --detach FETCH_HEAD
            git restore --source="$fork_main_commit" --staged --worktree --no-overlay -- "${OCLP_PRESERVED_PATHS[@]}"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            if ! git diff --cached --quiet; then
              git commit -m "Apply fork customizations to upstream $upstream_tag"
            fi
            git tag "$upstream_tag"
            git push origin "refs/tags/$upstream_tag"
          fi
          if ! gh release view "$upstream_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh workflow run build-app-wxpython.yml --ref "$upstream_tag" --repo "$GITHUB_REPOSITORY"
          fi
