name: CI - Build wxPython

on:
  push:
    tags:
      - '*'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write
  
jobs:
  build:
    name: Build wxPython
    runs-on: macos-15
    if: github.repository_owner == 'JeoJay127'

    env:
      branch: ${{ github.ref }}
      ANALYTICS_KEY: ${{ secrets.ANALYTICS_KEY }}
      ANALYTICS_SITE: ${{ secrets.ANALYTICS_SITE }}

    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          source .github/upstream-preserve.sh
          oclp_upstream_pathspec
          git fetch --no-tags --depth=1 https://github.com/dortania/OpenCore-Legacy-Patcher.git "refs/tags/$GITHUB_REF_NAME"
          if ! git diff --quiet HEAD FETCH_HEAD -- "${OCLP_UPSTREAM_PATHSPEC[@]}"; then
            echo "Release source differs from upstream tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
     
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'

      - name: Install Dependencies
        run: python3 -m pip install --requirement requirements.txt 'wxpython==4.2.2'

      - name: Force Universal2 charset for Python
        run: |
          python3 -m pip uninstall -y charset_normalizer
          python3 -m pip download --platform macosx_10_9_universal2 --only-binary=:all: charset-normalizer
          python3 -m pip install charset_normalizer-*-macosx_10_9_universal2.whl

      - name: Prepare Build Steps
        run: |
          commiturl="https://github.com/${{ github.repository }}/commit/$(git rev-parse HEAD)"
          commitdate=$(git show -s --format=%cI HEAD)
          python3 Build-Project.command --run-as-individual-steps --prepare-assets
          python3 Build-Project.command --git-branch "${{ env.branch }}" \
            --git-commit-url "$commiturl" --git-commit-date "$commitdate" \
            --analytics-key "${{ env.ANALYTICS_KEY }}" --analytics-endpoint "${{ env.ANALYTICS_SITE }}" \
            --reset-pyinstaller-cache --run-as-individual-steps --prepare-application
          python3 Build-Project.command --run-as-individual-steps --prepare-package

      - name: Upload AutoPkg Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoPkg-Assets.pkg
          path: ./dist/AutoPkg-Assets.pkg
          if-no-files-found: error

      - name: Upload Installation Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher.pkg
          path: ./dist/OpenCore-Patcher.pkg
          if-no-files-found: error

      - name: Upload Uninstaller Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher-Uninstaller.pkg
          path: ./dist/OpenCore-Patcher-Uninstaller.pkg
          if-no-files-found: error

      - name: Prepare Release
        if: github.ref_type == 'tag'
        run: |
          release_tag="$GITHUB_REF_NAME"
          base_version="${release_tag%%-*}"
          base_version="${base_version#v}"
          upstream_prerelease=$(gh api "repos/dortania/OpenCore-Legacy-Patcher/releases/tags/$release_tag" --jq .prerelease)
          changelog_notes=$(awk -v version="$base_version" '
            $1 == "##" && $2 == version { section = 1; next }
            section && $1 == "##" { exit }
            section { print }
          ' CHANGELOG.md)
          if [[ -z "$changelog_notes" ]]; then
            echo "No changelog entries for $base_version" >&2
            exit 1
          fi
          {
            printf 'Based on [Dortania OpenCore Legacy Patcher %s](https://github.com/dortania/OpenCore-Legacy-Patcher/releases/tag/%s).\n\n' "$release_tag" "$release_tag"
            if [[ "$upstream_prerelease" == "true" ]]; then
              printf 'Dortania marks this upstream version as a pre-release and warns of instability, system crashes, and possible data loss. OCLP-X publishes it as a formal fork release.\n\n'
            fi
            printf '%s\n' "$changelog_notes"
          } > release_notes.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release and Upload Assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./dist/AutoPkg-Assets.pkg
            ./dist/OpenCore-Patcher.pkg
            ./dist/OpenCore-Patcher-Uninstaller.pkg
